# ---------------------------------------------------------------------------
# Outer nginx for the DBE Faculty Expertise Explorer, mounted at /expert/.
#
# Drop these blocks into the existing server { } for
# ritmeisz8d02.chmcres.cchmc.org, replacing whatever pointed /expert/ at the old
# Streamlit process on 8501.
#
# Ports match what docker-compose.yml publishes, both on 127.0.0.1 only:
#     frontend  127.0.0.1:8080   nginx serving the built SPA
#     backend   127.0.0.1:8011   FastAPI
# Neo4j and Postgres publish nothing and are unreachable from the host.
#
# Verified end to end against this exact configuration before shipping.
# ---------------------------------------------------------------------------

# Emit relative Location headers, so a redirect cannot invent the wrong scheme,
# host, or port when this sits behind another proxy or a non standard port.
absolute_redirect off;

# Visiting the mount point without the trailing slash would otherwise miss the
# location below and 404.
location = /expert {
    return 301 /expert/;
}

# ---------------------------------------------------------------------------
# API. This MUST come before the /expert/ block: nginx picks the longest
# matching prefix, so declaring it first keeps the intent obvious to a reader.
#
# The trailing slash on both the location and proxy_pass strips the /expert
# prefix, so /expert/api/health reaches the backend as /api/health.
# ---------------------------------------------------------------------------
location /expert/api/ {
    proxy_pass http://127.0.0.1:8011/api/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /expert;

    # Answers are Server Sent Events (text/event-stream), NOT WebSockets, so no
    # Upgrade or "Connection: upgrade" header is needed or wanted here. What SSE
    # does need is an empty Connection header plus buffering off. Without these
    # the whole answer arrives in one lump after 25 to 45 seconds instead of
    # streaming its progress, which is the single most visible thing to get wrong.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # An open ended question legitimately runs 25 to 45 seconds, and the stream
    # stays open throughout. The default 60s read timeout would sever it.
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
}

# ---------------------------------------------------------------------------
# The app itself. The trailing slash on proxy_pass strips /expert, so the
# container serves everything from its own root and needs no knowledge of the
# mount point. The bundle already requests /expert/assets/..., which arrives here
# and is rewritten to /assets/... on the way through.
#
# The container's own nginx handles the single page app history fallback, so
# /expert/admin resolves without another rule.
# ---------------------------------------------------------------------------
location /expert/ {
    proxy_pass http://127.0.0.1:8080/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /expert;
}
