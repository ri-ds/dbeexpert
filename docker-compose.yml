name: dbeexpert

# ---------------------------------------------------------------------------
# DBE Faculty Expertise Explorer, whole stack.
#
#   neo4j-load  one shot, restores dump/neo4j.dump into the data volume, then
#               writes a marker file so later runs skip the restore
#   neo4j       the graph database, Enterprise because the dump uses the block
#               storage format which Community cannot read
#   postgres    user feedback, kept apart from the graph so a graph restore can
#               never overwrite anything a user wrote
#   backend     FastAPI, owns all OpenAI, Neo4j, and Postgres access
#   frontend    nginx serving the built React app and proxying /api to backend
#
# Everything talks over the dbe network by Docker service name, never localhost,
# so the stack is identical on any machine. Data lives in named volumes and
# survives `docker compose down`, which does not remove volumes.
#
#   docker compose down && docker compose up -d --build
#
# Requires two things per machine, both documented in the README:
#   1. .env holding the secrets     (copy .env.example)
#   2. ./dump/neo4j.dump            (163 MB, too large for Git)
#
# Hosting behind a reverse proxy:
#   * Set BASE_PATH to the sub path, for example /expert/. It is a build argument
#     because Vite bakes it into every asset URL, so it takes effect on rebuild.
#   * Only frontend and backend publish ports, and only on 127.0.0.1, so nginx on
#     the host is the single way in. Neo4j and Postgres stay on the internal
#     network with no host binding at all.
#   * Every secret is required rather than defaulted. A missing value fails the
#     command with the variable named, instead of silently booting with a
#     well known password.
# ---------------------------------------------------------------------------

services:
  neo4j-load:
    image: neo4j:${NEO4J_IMAGE_TAG:-2026.06-enterprise}
    container_name: dbe-neo4j-load
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT:-eval}
    volumes:
      - neo4j_data:/data
      - ./dump:/dumps:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        if [ -f /data/.dbe-restored ]; then
          echo "[load] Marker found at /data/.dbe-restored, database already restored. Skipping."
          exit 0
        fi
        if [ ! -f /dumps/neo4j.dump ]; then
          echo ""
          echo "==============================================================="
          echo " The Neo4j dump is missing, so there is no graph to serve."
          echo ""
          echo " Expected file:  ./dump/neo4j.dump"
          echo ""
          echo " The dump is 163 MB, far past what Git should carry, so it is"
          echo " deliberately not in the repository. Copy it in once per machine:"
          echo ""
          echo "     mkdir -p dump"
          echo "     cp /path/to/your/neo4j.dump dump/neo4j.dump"
          echo ""
          echo " The file must be named exactly neo4j.dump, because neo4j-admin"
          echo " derives the target database name from the filename."
          echo ""
          echo " Then run:  docker compose up -d --build"
          echo "==============================================================="
          echo ""
          exit 1
        fi
        echo "[load] Restoring dump/neo4j.dump into the 'neo4j' database."
        neo4j-admin database load neo4j --from-path=/dumps --overwrite-destination=true
        touch /data/.dbe-restored
        echo "[load] Restore complete."
    restart: "no"

  neo4j:
    image: neo4j:${NEO4J_IMAGE_TAG:-2026.06-enterprise}
    container_name: dbe-neo4j
    depends_on:
      neo4j-load:
        condition: service_completed_successfully
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT:-eval}
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
      # Read by the healthcheck from inside the container, so the password is not
      # interpolated into the healthcheck command that `docker compose config`
      # prints.
      #
      # The name must NOT begin with NEO4J_. This image turns every NEO4J_* env
      # var into a neo4j.conf setting, so NEO4J_HEALTHCHECK_PASSWORD became the
      # setting "HEALTHCHECK.PASSWORD" and strict validation refused to start the
      # server at all.
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
    # No published ports. Only the backend talks to Neo4j and it does so over the
    # compose network, so binding 7474 and 7687 on the host would expose the Neo4j
    # browser and the Bolt protocol to anything that can reach the server. To
    # inspect the graph, tunnel in instead:
    #   ssh -L 7474:localhost:7474 -L 7687:localhost:7687 <server>
    # having temporarily added a 127.0.0.1 binding, or use `make shell-neo4j`,
    # which runs cypher-shell inside the container and needs no ports at all.
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # cypher-shell succeeding is the only reliable signal that the database is
      # actually online and accepting queries, not merely that the port is open.
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p "$$HEALTHCHECK_PASSWORD" 'RETURN 1' >/dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Feedback storage. Deliberately separate from Neo4j: the graph is rebuilt by
  # loading a dump, and user submitted data must never live somewhere a restore
  # could overwrite.
  postgres:
    image: postgres:16-alpine
    container_name: dbe-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbefeedback}
      POSTGRES_USER: ${POSTGRES_USER:-dbe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # No published ports. Only the backend uses this, over the compose network.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-dbe} -d ${POSTGRES_DB:-dbefeedback}
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: dbeexpert-backend:latest
    container_name: dbe-backend
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      NEO4J_DATABASE: neo4j
      NEO4J_VECTOR_INDEX: ${NEO4J_VECTOR_INDEX:-text_embeddings}
      # text_embeddings2 matches the original Streamlit app. chunk_text_fulltext
      # is the technically better index but retrieves a different set of chunks,
      # which changes which faculty an open ended question returns.
      NEO4J_FULLTEXT_INDEX: ${NEO4J_FULLTEXT_INDEX:-text_embeddings2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5-mini}
      # MUST match the model that wrote the vectors in the dump. Do not change to
      # text-embedding-3-small: it is also 1536 dimensions so the startup width
      # check still passes, but it is a different embedding space and answers
      # silently degrade. Measured, top similarity drops from 0.92 to 0.52.
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-ada-002}
      OPENAI_TITLE_MODEL: ${OPENAI_TITLE_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      PIPELINE_MAX_CONCURRENCY: ${PIPELINE_MAX_CONCURRENCY:-10}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-100}
      MAX_JUDGED_FACULTY: ${MAX_JUDGED_FACULTY:-24}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-120}
      CYPHER_TIMEOUT_SECONDS: ${CYPHER_TIMEOUT_SECONDS:-30}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-21600}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dbe}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-dbefeedback}
      # Temporary gate on the admin feedback view, replaced by SSO group checks later.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      # Header the SSO proxy uses for the signed in user, and where Sign out
      # goes. The logout URL is empty by default and the button stays hidden
      # until it is set, since a dead logout link is worse than none.
      AUTH_USER_HEADER: ${AUTH_USER_HEADER:-X-Forwarded-User}
      AUTH_LOGOUT_URL: ${AUTH_LOGOUT_URL:-}
      # In production the API is same origin, since nginx serves /expert/api/ from
      # the same host as the app, so CORS is not exercised at all. Set correctly
      # anyway for any non browser or cross origin caller.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    # Bound to the loopback interface, so the only way in is through the reverse
    # proxy. Published at all only so nginx on the host can reach it.
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8011}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Where the app is mounted. Baked into every asset URL and read at runtime
        # as import.meta.env.BASE_URL, so this one value drives the sub path.
        # Changing it requires a rebuild, which the deploy command already does.
        BASE_PATH: ${BASE_PATH:-/}
    image: dbeexpert-frontend:latest
    container_name: dbe-frontend
    depends_on:
      - backend
    # Loopback only, same reasoning as the backend.
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  # Named, so `docker compose down` keeps them and `up` reattaches. Removing
  # them is an explicit act: `docker compose down -v`, or `make reset-db`.
  neo4j_data:
  neo4j_logs:
  postgres_data:

networks:
  # Declared explicitly rather than relying on the implicit default, so the
  # shared network the services resolve each other on is visible in the file.
  default:
    name: dbe
