name: CI

# Runs on GitHub's own runners, which have no access to the deploy server.
# Everything here is checkable without a database, without Neo4j and without an
# OpenAI key, which is exactly what the parity tests were written to be.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Parity tests
        # The suite imports app.pipeline, so the real dependencies must be
        # installed, but it touches no database and makes no API calls. A dummy
        # key is supplied only because the settings module reads the variable.
        env:
          OPENAI_API_KEY: sk-ci-not-a-real-key
        run: python backend/tests/test_parity.py

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` already runs typecheck, but running it separately makes
      # a type error obvious in the log rather than buried in a build failure.
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        # BASE_PATH is deliberately left at the default here. The server bakes
        # its own value in at deploy time, so CI only proves the build compiles.
        run: npm run build

  compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        # docker-compose.yml uses the ${VAR:?message} form for every secret, so
        # `docker compose config` fails outright when they are absent. Dummy
        # values are injected purely so the file can be parsed and validated;
        # none of them reach a running container.
        env:
          OPENAI_API_KEY: sk-ci-not-a-real-key
          NEO4J_PASSWORD: ci-placeholder
          POSTGRES_PASSWORD: ci-placeholder
          ADMIN_PASSWORD: ci-placeholder
        run: |
          docker compose config --quiet
          echo "compose file is valid"
